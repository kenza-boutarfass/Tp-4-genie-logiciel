<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salles | Gestion universitaire</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main th:replace="~{fragments/layout :: layout('Gestion des salles', 'rooms', ~{::content})}">
    <section th:fragment="content" class="page">
        <p class="page-description">Ajouter, modifier, rechercher et consulter les espaces universitaires.</p>
        <section class="card">
            <h2>Ajouter une salle</h2>
            <form class="form-grid" method="post" th:action="@{/salles/ajouter}">
                <label>Identifiant<input name="identifiant" placeholder="Ex. S-401" required></label>
                <label>Nom<input name="nom" placeholder="Nom de la salle" required></label>
                <label>Capacité<input name="capacite" type="number" min="1" placeholder="Places" required></label>
                <label>Équipements<input name="equipements" placeholder="Projecteur, tableau"></label>
                <button class="button primary form-action" type="submit">Ajouter la salle</button>
            </form>
        </section>
        <section class="card">
            <h2>Recherche</h2>
            <form class="filter-form" method="get" th:action="@{/salles}">
                <label>Capacité minimale<input name="capacite" type="number" min="1" th:value="${capacite}" placeholder="Ex. 30"></label>
                <label>Équipement<input name="equipement" th:value="${equipement}" placeholder="Ex. projecteur"></label>
                <button class="button secondary" type="submit">Filtrer</button>
                <a class="button quiet" th:href="@{/salles}">Afficher toutes</a>
            </form>
        </section>
        <section class="card">
            <h2>Espaces disponibles <span class="count" th:text="${salles.size()}">0</span></h2>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Identifiant</th><th>Salle</th><th>Capacité</th><th>Équipements</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="salle : ${salles}">
                        <td data-label="Identifiant" th:text="${salle.identifiant}"></td>
                        <td data-label="Salle" th:text="${salle.nom}"></td>
                        <td data-label="Capacité" th:text="${salle.capacite}"></td>
                        <td data-label="Équipements" th:text="${#strings.listJoin(salle.equipements, ', ')}"></td>
                        <td data-label="Actions" class="row-actions">
                            <details class="edit-details">
                                <summary>Modifier</summary>
                                <form class="edit-form" method="post" th:action="@{/salles/modifier}">
                                    <input type="hidden" name="identifiant" th:value="${salle.identifiant}">
                                    <label>Nom<input name="nom" th:value="${salle.nom}" required></label>
                                    <label>Capacité<input name="capacite" type="number" min="1" th:value="${salle.capacite}" required></label>
                                    <label>Équipements<input name="equipements" th:value="${#strings.listJoin(salle.equipements, ', ')}"></label>
                                    <button class="button secondary" type="submit">Enregistrer</button>
                                </form>
                            </details>
                            <form method="post" th:action="@{/salles/supprimer}" onsubmit="return confirm('Supprimer cette salle ?')">
                                <input type="hidden" name="identifiant" th:value="${salle.identifiant}">
                                <button class="button danger" type="submit">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${salles.isEmpty()}"><td colspan="5" class="empty">Aucune salle ne correspond à la recherche.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</main>
</body>
</html>
